<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page.title | escape }} | Tianhao Wu</title>
<meta name="description" content="{{ site.description | escape }}">
<link rel="canonical" href="{{ page.url | absolute_url }}">
<link rel="stylesheet" href="{{ '/assets/css/modern.css' | relative_url }}">
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header class="header"><a class="wordmark" href="{{ '/' | relative_url }}">TW<span>.</span></a>
<nav aria-label="Main navigation">{% for item in site.data.navigation.main %}<a href="{{ item.url | relative_url }}">{{ item.title }}</a>{% endfor %}</nav>
<a class="contact" href="https://github.com/HereW">GitHub <span aria-hidden="true">↗</span></a></header>
<main id="main">{{ content }}</main>
<footer><span>© {{ site.time | date: '%Y' }} Tianhao Wu · Tianjin University</span><a href="https://github.com/HereW">GitHub ↗</a><span>Built with Jekyll · Academic Pages</span></footer>
</body>
</html>
